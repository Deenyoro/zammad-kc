name: Build and Push Zammad Image

on:
  push:
    branches: [develop]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push image to GHCR'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Fork-sync protection: upstream Zammad ships workflows (CI, docker-release,
  # packager.io, …) that need upstream's runners/secrets and fail in this fork,
  # leaving a red ✗ on every sync. Any workflow that is not ours gets
  # (re-)disabled here automatically — including ones upstream adds in the
  # future — so hitting "Sync fork" can never introduce a failing check.
  housekeeping:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Disable foreign workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=".github/workflows/build-and-push.yml"
          gh api "repos/${{ github.repository }}/actions/workflows" --paginate \
            -q '.workflows[] | [(.id|tostring), .state, .path] | @tsv' |
          while IFS=$'\t' read -r id state path; do
            if [ "$path" != "$keep" ] && [ "$state" = "active" ]; then
              echo "Disabling foreign workflow: $path"
              gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/disable"
            fi
          done

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full (blobless) history so heal-patches.sh can 3-way re-anchor
          # drifted patches against their pre-image blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Self-heal drifted KC patches
        env:
          HEAL_PUSH_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
        run: kc/script/heal-patches.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_images != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          platforms: linux/amd64
